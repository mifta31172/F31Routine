 return x?`<div class=card><small>Next class</small><b>${esc(x.t)}</b><span>Starts at ${f12(x.a)}, in ${x.a-m} min</span></div>`:'<div class=card><b>Classes are over for today</b></div>'}

 let h=pin()+liveCard()+quote()+`<div class=sec>Today · Group ${g}</div>`;
 h+=cur.length?cur.map(e=>{const n=Math.round((e.e-e.s)/DAY)+1,i=Math.round((t-e.s)/DAY)+1,l=n-i;return `<div class="card hero"><b>${esc(e.t)}</b><span>${rng(e)}</span><div class=bar><i style="width:${i/n*100}%"></i></div><small>Day ${i} of ${n} · ${l?l+(l>1?' days':' day')+' left':'last day'}</small></div>`}).join(''):'<div class=card><b>No posting today</b><span>Check what’s next below.</span></div>';

 if(nx){const n=Math.round((nx.s-t)/DAY);h+=`<div class=sec>Up next</div><div class=card><b>${esc(nx.t)}</b><span>${rng(nx)}</span><small>${n==1?'Starts tomorrow':'In '+n+' days'}</small><a href="${cal(nx)}" target=_blank rel=noopener>Add to calendar</a></div>`}

const SGT={'0.0':'AB,C,E,F,D','1.0':'DE,F,A,B,C','2.0':'AC,B,D,E,F','3.0':'EF,D,B,C,A','4.0':'BC,A,F,D,E','4.1':'DF,E,C,A,B','4.2':'AC,B,D,E,F'};
const SN=[['Internal Medicine'],['Paediatrics','Dermatology','Psychiatry'],['Surgery','Urology','Orthopaedics','Paediatric Surgery'],['Eye','ENT'],['Gynaecology & Obstetrics']],SC=[[],[12,24],[20,25,30],[17],[]];

function render(){
 const V={today:vToday,schedule:vSched,notices:vNotes},r=ls('r'),pick=(!g||home)&&tab!='notices';
 $('#app').innerHTML=`<header><div class=top><span id=clk>${clk()}</span>${g&&!pick?'<button class=link id=rb>⌂ Change roll</button>':''}</div><h1>F-31 Routine</h1><small>Faridpur Medical College${g?' · Group '+g+(r?' · Roll '+r:''):''}</small></header>`+(g&&!pick?`<div class=chips>${[...G].map(c=>`<button class="chip${c==g?' on':''}" data-g=${c}>${c}</button>`).join('')}</div>`:'')+`<main>${pick?vPick():V[tab]()}<footer>© Made with ♥ by Md Miftahul Islam, F-31172</footer></main><nav>${NAV.map(n=>`<button data-t=${n[0]} class="${tab==n[0]?'on':''}">${n[1]}${n[0]=='notices'&&unread()&&tab!='notices'?'<i class=dot></i>':''}</button>`).join('')}</nav>`;push()}
const ms=m=>{const x=$('#ms');if(x)x.textContent=m};
function buildDoc(s){const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#st').textContent=JSON.stringify(s).replace(/</g,'\\u003c');c.removeAttribute('data-theme');return '<!doctype html>\n'+c.outerHTML}
async function save(p){try{const a=typeof claude!='undefined'&&await claude.use('artifact');if(!a){ms('Publishing is not available here.');return}ms('Publishing…');await a.publish(buildDoc({...st,...p}))}catch(e){ms(e&&e.code=='conflict'?'Updated elsewhere, reloading…':'Could not publish ('+((e&&e.code)||'error')+')')}}
$('#app').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id=='pub'){const t=$('#nt').value.trim();if(!t){ms('Add a title first.');return}b.disabled=true;await save({notices:[{i:Date.now(),t,b:$('#nb').value.trim(),p:$('#np').checked,d:fd(new Date())}].concat(st.notices)});b.disabled=false;return}
 if(b.id=='sg'){await save({sgt:$('#sd').value,sun:$('#su').value});return}
 if(b.dataset.i){if(b.dataset.c!='1'){b.dataset.c='1';b.textContent='Tap again to delete';return}await save({notices:st.notices.filter(n=>String(n.i)!=b.dataset.i)});return}
 if(b.id=='rb'){home=true;tab='today'}
 else if(b.id=='back'){home=false}
 else if(b.dataset.g){g=b.dataset.g;ls('g',g);ls('r','');home=false}
 else if(b.id=='go'){const r=+$('#rl').value;if(!(r>=1&&r<=183)){ms('Please enter a roll number between 1 and 183.');return}g=G[Math.min(5,Math.ceil(r/30)-1)];ls('g',g);ls('r',String(r));home=false}
 else if(b.dataset.t){tab=b.dataset.t;home=false;if(tab=='notices')ls('seen',JSON.stringify(st.notices.map(n=>n.i)))}
 else return;
 render()};
function parseTxt(t){const N=[],S={},D={};
 t.replace(/\r/g,'').split(/\n-{3,}[ \t]*(?:\n|$)/).forEach(b=>{const L=b.split('\n').filter(l=>!/^\s*#/.test(l));while(L.length&&!L[0].trim())L.shift();while(L.length&&!L[L.length-1].trim())L.pop();if(!L.length)return;const F=L[0].trim();
  if(/^(sgt|sun)\s*:/i.test(F)&&L.every(l=>!l.trim()||/^\s*(sgt|sun)\s*:/i.test(l))){L.forEach(l=>{const m=l.match(/^\s*(sgt|sun)\s*:\s*(\S+)/i);if(m)S[m[1].toLowerCase()]=m[2]});return}
  const dm=F.match(/^day\s*:\s*(\d{4}-\d{2}-\d{2})/i);
  if(dm){L.slice(1).forEach(l=>{const m=l.match(/^\s*(lecture|integrated|seminar|ward|sgt|note)(?:\s+([A-Fa-f,\s]+?))?\s*:\s*(.+)$/i);if(m)(D[dm[1]]=D[dm[1]]||[]).push({k:m[1].toLowerCase(),g:(m[2]||'').toUpperCase().replace(/[^A-F]/g,''),v:m[3].trim()})});return}
  let d='',x=null;const body=L.slice(1).filter(l=>{let m=l.match(/^date\s*:\s*(.+)/i);if(m){d=m[1].trim();return false}m=l.match(/^expires\s*:\s*(.+)/i);if(m){const v=m[1].trim(),y=new Date(v.replace(' ','T')+(v.length<=10?'T23:59:59':''));if(!isNaN(y))x=+y;return false}return true}).join('\n').trim();
  N.push({i:[...L.join('\n')].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7),o:N.length,t:F.replace(/^\*\s*/,'').trim(),b:body,p:F[0]=='*',d,x})});
 return{N,S,D}}
async function loadRemote(){try{const r=await fetch('notices.txt?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();if(t.trim()[0]=='<')return;const x=parseTxt(t);st.notices=x.N;st.days=x.D;if(x.S.sgt)st.sgt=x.S.sgt;if(x.S.sun)st.sun=x.S.sun;render()}catch(e){}}
render();loadRemote();
let lm=new Date().getMinutes();
setInterval(()=>{const n=new Date(),c=$('#clk');if(c)c.textContent=clk();if(n.getMinutes()!=lm){lm=n.getMinutes();const a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))render()}},1000);
(async()=>{try{if(typeof claude=='undefined')return;const u=await claude.use('user');if(u&&await u.isOwner()){owner=true;render()}}catch(e){}})();
</script>
