# FELO 31 APK builder. Runs when index.html or this folder changes, or from the Actions tab (Run workflow).
# One-time setup for a stable signing key: see the guide, section "Signing key".
name: Build FELO 31 APK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['index.html', '.github/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Create Android project
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -e
          mkdir -p app/src/main/java/com/f31/routine app/src/main/assets app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "F31Routine"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.f31.routine"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.f31.routine"
                  minSdk = 26
                  targetSdk = 34
                  // The GitHub build number goes up with every build, so a new APK installs as an update.
                  versionCode = System.getenv("GITHUB_RUN_NUMBER")?.toIntOrNull() ?: 1
                  versionName = "4.2"
                  // Leave empty to use the bundled copy (works offline).
                  // Put your PUBLIC page link here to get live notices from the web version.
                  buildConfigField("String", "APP_URL", "\"__APP_URL__\"")
              }
              signingConfigs {
                  create("f31") {
                      storeFile = file("f31.keystore")
                      storeType = "pkcs12"
                      storePassword = "f31routine"
                      keyAlias = "f31"
                      keyPassword = "f31routine"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      if (file("f31.keystore").exists()) signingConfig = signingConfigs.getByName("f31")
                  }
                  getByName("release") {
                      isMinifyEnabled = false
                      isDebuggable = false
                      if (file("f31.keystore").exists()) signingConfig = signingConfigs.getByName("f31")
                  }
              }
              buildFeatures { buildConfig = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="FELO 31"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".Receiver" android:exported="false" />
                  <receiver android:name=".AlertPoller" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/f31/routine/MainActivity.kt <<'EOF'
          package com.f31.routine

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.net.Uri
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private var fileCb: ValueCallback<Array<Uri>>? = null
              private val asset = "file:///android_asset/index.html"

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)

                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  // Security: the app shows only its own bundled page. No file-URL access, safe browsing on. Content access is needed for the file picker.
                  web.settings.allowFileAccess = false
                  web.settings.allowContentAccess = true
                  web.settings.safeBrowsingEnabled = true
                  web.addJavascriptInterface(Bridge(), "AndroidBridge")
                  web.webViewClient = object : WebViewClient() {
                      // Calls, downloads and websites open outside the app. Only the bundled page stays inside.
                      override fun shouldOverrideUrlLoading(v: WebView, r: WebResourceRequest): Boolean {
                          if (r.url.scheme == "file") return false
                          try {
                              startActivity(Intent(Intent.ACTION_VIEW, r.url))
                          } catch (e: ActivityNotFoundException) {
                          }
                          return true
                      }
                  }
                  // Lets the admin pick files and images (study material, notice attachments) inside the app.
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          v: WebView, cb: ValueCallback<Array<Uri>>, p: WebChromeClient.FileChooserParams
                      ): Boolean {
                          fileCb?.onReceiveValue(null)
                          fileCb = cb
                          val pick = Intent(Intent.ACTION_GET_CONTENT)
                          pick.addCategory(Intent.CATEGORY_OPENABLE)
                          pick.type = "*/*"
                          pick.putExtra(
                              Intent.EXTRA_MIME_TYPES,
                              arrayOf(
                                  "application/pdf", "image/*", "text/plain",
                                  "application/msword",
                                  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                                  "application/vnd.ms-powerpoint",
                                  "application/vnd.openxmlformats-officedocument.presentationml.presentation",
                                  "application/vnd.ms-excel",
                                  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                              )
                          )
                          return try {
                              startActivityForResult(Intent.createChooser(pick, "Choose a file"), 77)
                              true
                          } catch (e: Exception) {
                              fileCb?.onReceiveValue(null)
                              fileCb = null
                              false
                          }
                      }
                  }
                  setContentView(web)
                  web.loadUrl(asset)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  if (req == 77) {
                      fileCb?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data))
                      fileCb = null
                  } else {
                      super.onActivityResult(req, res, data)
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }

              // The bundled page talks to the phone through this small bridge.
              inner class Bridge {
                  @JavascriptInterface
                  fun set(json: String) = Reminders.schedule(applicationContext, json)

                  @JavascriptInterface
                  fun alr(g: String, id: Long) = Alerts.base(applicationContext, g, id)

                  @JavascriptInterface
                  fun ver(): Int = BuildConfig.VERSION_CODE

                  @JavascriptInterface
                  fun base(): String = BuildConfig.APP_URL

                  @JavascriptInterface
                  fun share(text: String) {
                      runOnUiThread {
                          val i = Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT, text)
                          startActivity(Intent.createChooser(i, null))
                      }
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/f31/routine/Reminders.kt <<'EOF'
          package com.f31.routine

          import android.app.AlarmManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import org.json.JSONArray
          import java.net.HttpURLConnection
          import java.net.URL

          object Reminders {
              private fun pi(c: Context, id: Int, h: String?, b: String?, create: Boolean): PendingIntent? {
                  val i = Intent(c, Receiver::class.java).putExtra("h", h).putExtra("b", b)
                  val f = PendingIntent.FLAG_IMMUTABLE or
                      (if (create) PendingIntent.FLAG_UPDATE_CURRENT else PendingIntent.FLAG_NO_CREATE)
                  return PendingIntent.getBroadcast(c, id, i, f)
              }

              /** Replaces all scheduled reminders with the list the page sends: [{t:epochMs,h:title,b:text}] */
              fun schedule(c: Context, json: String) {
                  val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val sp = c.getSharedPreferences("rem", 0)
                  for (n in 0 until sp.getInt("n", 0)) pi(c, n, null, null, false)?.let { am.cancel(it); it.cancel() }
                  val a = JSONArray(json)
                  val now = System.currentTimeMillis()
                  var k = 0
                  for (n in 0 until a.length()) {
                      val o = a.getJSONObject(n)
                      if (o.getLong("t") <= now) continue
                      am.setAndAllowWhileIdle(
                          AlarmManager.RTC_WAKEUP, o.getLong("t"),
                          pi(c, k, o.getString("h"), o.getString("b"), true)!!
                      )
                      k++
                  }
                  sp.edit().putInt("n", k).putString("json", json).apply()
              }
          }


          /** Admin notifications: the app checks alerts.json every ~15 minutes and notifies the right group. */
          object Alerts {
              private const val CH = "alr"

              fun post(c: Context, t: String, b: String) {
                  val nm = c.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel(CH, "Notices and updates", NotificationManager.IMPORTANCE_HIGH))
                  val open = PendingIntent.getActivity(c, 0, Intent(c, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(c, CH)
                      .setSmallIcon(R.drawable.ic_stat)
                      .setColor(0xFF0B7A5A.toInt())
                      .setContentTitle(t)
                      .setContentText(b)
                      .setStyle(Notification.BigTextStyle().bigText(b))
                      .setContentIntent(open)
                      .setAutoCancel(true)
                      .build()
                  nm.notify((System.currentTimeMillis() % Int.MAX_VALUE).toInt(), n)
              }

              fun schedule(c: Context) {
                  val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val pi = PendingIntent.getBroadcast(
                      c, 9001, Intent(c, AlertPoller::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  am.setInexactRepeating(
                      AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + 5 * 60 * 1000L, 15 * 60 * 1000L, pi
                  )
              }

              /** Called by the page after it has shown the alerts, so they are not notified twice. */
              fun base(c: Context, g: String, id: Long) {
                  val sp = c.getSharedPreferences("alr", 0)
                  sp.edit().putString("g", g).putLong("last", maxOf(sp.getLong("last", 0L), id)).apply()
                  schedule(c)
              }

              fun check(c: Context) {
                  val sp = c.getSharedPreferences("alr", 0)
                  val g = sp.getString("g", "") ?: ""
                  if (g.isEmpty()) return
                  val conn = URL(BuildConfig.APP_URL + "alerts.json?v=" + System.currentTimeMillis()).openConnection() as HttpURLConnection
                  conn.connectTimeout = 10000
                  conn.readTimeout = 10000
                  try {
                      if (conn.responseCode != 200) return
                      val arr = JSONArray(conn.inputStream.bufferedReader().readText())
                      val last = sp.getLong("last", 0L)
                      var max = last
                      for (n in 0 until arr.length()) {
                          val o = arr.getJSONObject(n)
                          val id = o.getLong("id")
                          if (id > max) max = id
                          if (id <= last) continue
                          val tg = o.optString("g", "")
                          if (tg.isNotEmpty() && !tg.contains(g)) continue
                          post(c, o.optString("t"), o.optString("b"))
                      }
                      sp.edit().putLong("last", max).apply()
                  } finally {
                      conn.disconnect()
                  }
              }
          }

          class AlertPoller : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  val pr = goAsync()
                  Thread {
                      try {
                          Alerts.check(c.applicationContext)
                      } catch (e: Exception) {
                      } finally {
                          pr.finish()
                      }
                  }.start()
              }
          }

          /** Re-creates the reminders after the phone restarts. */
          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  Reminders.schedule(c, c.getSharedPreferences("rem", 0).getString("json", "[]")!!)
                  Alerts.schedule(c)
              }
          }

          class Receiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  val nm = c.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel("cls", "Class reminders", NotificationManager.IMPORTANCE_HIGH)
                  )
                  val open = PendingIntent.getActivity(c, 0, Intent(c, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(c, "cls")
                      .setSmallIcon(R.drawable.ic_stat)
                      .setColor(0xFF0B7A5A.toInt())
                      .setContentTitle(i.getStringExtra("h"))
                      .setContentText(i.getStringExtra("b"))
                      .setStyle(Notification.BigTextStyle().bigText(i.getStringExtra("b")))
                      .setContentIntent(open)
                      .setAutoCancel(true)
                      .build()
                  nm.notify((System.currentTimeMillis() % Int.MAX_VALUE).toInt(), n)
              }
          }
          EOF
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#064E3B</color>
          </resources>
          EOF
          mkdir -p app/src/main/res/drawable-nodpi
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/ic_logo_fg.png
          echo '' | base64 -d > app/src/main/res/drawable-nodpi/ic_logo_bg.png
          cat > app/src/main/res/drawable/ic_stat.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M10,3h4v7h7v4h-7v7h-4v-7H3v-4h7z" />
          </vector>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_logo_bg" />
              <foreground android:drawable="@drawable/ic_logo_fg" />
          </adaptive-icon>
          EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
              <monochrome android:drawable="@drawable/ic_mono" />
          </adaptive-icon>
          EOF
          
          # Plain PNG launcher icons: used by launchers that ignore adaptive icons, and as a safe fallback.
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          echo '' | base64 -d > app/src/main/res/mipmap-mdpi/ic_launcher.png
          echo '' | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          echo '' | base64 -d > app/src/main/res/mipmap-xhdpi/ic_launcher.png
          echo '' | base64 -d > app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          echo '' | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/f31.keystore
          else
            echo "::warning::KEYSTORE_B64 secret is not set. This build uses a temporary key, so Android may refuse to install it over an older build and Play Protect may warn. Add the secret (see the comments at the top of this file)."
            keytool -genkeypair -keystore app/f31.keystore -storetype pkcs12 -alias f31 -keyalg RSA -keysize 2048 -validity 36500 -storepass f31routine -keypass f31routine -dname "CN=Md. Miftahul Islam, OU=F-31, O=FELO 31, L=Faridpur, C=BD"
          fi
          cp index.html app/src/main/assets/index.html
          URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          sed -i "s|__APP_URL__|$URL|" app/build.gradle.kts
      - run: gradle assembleRelease --no-daemon --stacktrace
      - name: Name the APK and write its checksum
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort | tail -1)
          "$AAPT2" dump badging app/build/outputs/apk/release/app-release.apk > badging.txt
          grep -E "^package:|application-label:|application-icon" badging.txt
          grep -q "application-icon" badging.txt || { echo "::error::The launcher icon is missing from the APK"; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk FELO31.apk
          sha256sum FELO31.apk > FELO31.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: FELO31-APK
          path: |
            FELO31.apk
            FELO31.apk.sha256
      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: FELO 31 APK (latest)
          files: |
            FELO31.apk
            FELO31.apk.sha256
      - name: Show the APK link
        run: |
          echo "APK link (build ${GITHUB_RUN_NUMBER}): https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-apk/FELO31.apk" >> "$GITHUB_STEP_SUMMARY"
